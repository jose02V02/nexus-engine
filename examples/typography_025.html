<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus 0.25 Typography</title>
  <style>
    body { margin: 24px; background: #f5f7fb; color: #172033; font: normal 400 16px/1.6 sans-serif; }
    main { max-width: 680px; margin: auto; padding: 28px; background: white; }
    h1 { font: italic 700 34px/1.15 sans-serif; text-align: center; }
    .lead { font-size: 20px; line-height: 1.5; text-align: center; }
    .marked { font-weight: 700; text-decoration: underline line-through; }
    .aside { font-style: oblique; text-align: right; text-decoration: overline; }
  </style>
</head>
<body>
  <main>
    <h1>Nexus Typography 0.25</h1>
    <p class="lead">Peso, stile, ritmo verticale e allineamento ora attraversano l'intera pipeline.</p>
    <p class="marked">Decorazioni generate nella Display List.</p>
    <p class="aside">Typeface selezionato dal renderer Skia.</p>
  </main>
</body>
</html>
