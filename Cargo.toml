[package]
name = "nexus-engine"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "Nexus Engine 1.02 - WebAssembly passive elements and bulk table operations"
license = "MIT"
repository = "https://github.com/your-account/nexus-engine"
keywords = ["browser", "html", "css", "rendering", "skia"]
categories = ["web-programming", "network-programming"]

[lib]
name = "nexus_engine"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
url = "2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate", "cookies"] }
encoding_rs = "0.8.35"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
cssparser = "0.37"
taffy = { version = "0.13", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "content_size", "taffy_tree"] }
parley = "0.11.1"
skia-safe = "0.99.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
quickjs-rusty = { version = "0.13.0", default-features = false }
serde_json = "1.0"

reqwest_cookie_store = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
