name: Nexus Android Shell

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_VERSION: "1.02.0"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit release metadata and JNI
        run: python3 tools/release_audit.py --output release-audit.json

      - name: Install Clang for QuickJS-ng
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust 1.88.0 + Android target
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            android/native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Nexus JNI library (arm64-v8a)
        working-directory: android/native
        run: |
          cargo ndk \
            --target arm64-v8a \
            --platform 26 \
            --output-dir ../app/src/main/jniLibs \
            build --release

      - name: Verify native library
        run: test -s android/app/src/main/jniLibs/arm64-v8a/libnexus_android.so

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and hash APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee nexus-android-sha256.txt

      - name: Upload Nexus Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-${{ env.NEXUS_VERSION }}-android-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            nexus-android-sha256.txt
            release-audit.json
          if-no-files-found: error
